// Drag from electron source to target, or pick the starting point from the list.
function DragArrowCanvas({ q, t, theme, submitted, arrow, setArrow }) {
  const svgRef = React.useRef(null);
  const [drag, setDrag] = React.useState(null);
  const VB_W = 600, VB_H = 260;

  const getPt = (e) => {
    const rect = svgRef.current.getBoundingClientRect();
    return [((e.clientX - rect.left) / rect.width) * VB_W, ((e.clientY - rect.top) / rect.height) * VB_H];
  };
  const dist2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2;
  // The starting point matters most, so it is weighted double.
  const grade = (from, to) => {
    const best = q.arrowChoices.map(c => ({ c, s: 2 * dist2(from, c.from) + dist2(to, c.to) })).sort((x, y) => x.s - y.s)[0].c;
    return { from, to, correctChoice: !!best.correct, matchedId: best.id };
  };
  const onDown = (e) => {
    if (submitted) return;
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    const p = getPt(e); setDrag({ from: p, to: p });
  };
  const onMove = (e) => { if (drag && !submitted) setDrag(d => ({ ...d, to: getPt(e) })); };
  const onUp = () => {
    if (!drag || submitted) return;
    const moved = dist2(drag.from, drag.to) > 400;
    if (moved) setArrow(grade(drag.from, drag.to));
    setDrag(null);
  };
  const curve = (a) => ({ from: a.from, to: a.to, ctrl: [(a.from[0] + a.to[0]) / 2, Math.min(a.from[1], a.to[1]) - 40] });
  const correct = q.arrowChoices.find(c => c.correct);

  return (
    <div style={{ background: t.card, border: `1px solid ${t.line}`, borderRadius: 14, padding: 20 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10, gap: 12, flexWrap: 'wrap' }}>
        <Eyebrow color={t.muted}>STEP 1 · FISCHER ESTERIFICATION</Eyebrow>
        {!submitted && <Eyebrow color={theme.accent} style={{ fontWeight: 600 }}>DRAG FROM ELECTRON SOURCE TO TARGET</Eyebrow>}
      </div>
      <svg ref={svgRef} width="100%" viewBox={`0 0 ${VB_W} ${VB_H}`}
        onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
        style={{ cursor: submitted ? 'default' : 'crosshair', userSelect: 'none', touchAction: 'none', display: 'block', maxHeight: 260 }}>
        <g transform="translate(80,100) scale(2.2)"><PropanoicAcid x={0} y={0} /></g>
        <text x={420} y={100} fill={t.ink} style={{ font: '700 20px "JetBrains Mono", ui-monospace' }}>H</text>
        <circle cx={444} cy={92} r={10} fill="none" stroke={theme.accent} strokeWidth={1.5} />
        <text x={444} y={97} textAnchor="middle" style={{ font: '700 12px system-ui' }} fill={theme.accent}>+</text>
        {drag && (() => { const c = curve(drag); return <CurvedArrow from={c.from} to={c.to} ctrl={c.ctrl} color={theme.accent} active />; })()}
        {arrow && !drag && (() => {
          const c = curve(arrow);
          const color = submitted ? (arrow.correctChoice ? t.ok : t.bad) : theme.accent;
          return <CurvedArrow from={c.from} to={c.to} ctrl={c.ctrl} color={color} active />;
        })()}
        {submitted && arrow && !arrow.correctChoice && (() => { const c = curve(correct); return <g opacity="0.85"><CurvedArrow from={c.from} to={c.to} ctrl={c.ctrl} color={t.ok} /></g>; })()}
      </svg>
      {!submitted && (
        <div style={{ marginTop: 12 }}>
          <Eyebrow color={t.muted} style={{ marginBottom: 8 }}>OR PICK WHERE THE ARROW STARTS</Eyebrow>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            {q.arrowChoices.map(c => {
              const on = arrow && arrow.matchedId === c.id && arrow.picked;
              return (
                <button key={c.id} onClick={() => setArrow({ from: c.from, to: c.to, correctChoice: !!c.correct, matchedId: c.id, picked: true })}
                  style={{
                    padding: '7px 12px', borderRadius: 8, fontSize: 12, fontFamily: 'inherit', cursor: 'pointer', color: t.ink,
                    border: `1.5px solid ${on ? t.ink : t.line}`, background: on ? t.hover : t.card,
                  }}>{c.label}</button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function QuestionBody({ q, t, theme, order, shown, setShown, submitted, arrow, setArrow }) {
  if (q.type === 'arrow') return <DragArrowCanvas q={q} t={t} theme={theme} submitted={submitted} arrow={arrow} setArrow={setArrow} />;
  if (q.type === 'nmr') {
    return (
      <div style={{ background: t.card, border: `1px solid ${t.line}`, borderRadius: 14, padding: 24, overflowX: 'auto' }}>
        <div style={{ position: 'relative', width: 600, maxWidth: '100%' }}>
          <NMRSpectrum w={600} h={240} peaks={q.peaks} highlight={shown} />
          <div style={{ position: 'absolute', inset: 0 }}>
            {q.peaks.map((pk, i) => {
              const p = ((10 - pk.shift) / 10) * 100;
              const isHi = shown === i;
              const right = submitted && i === q.correctPeak;
              const wrong = submitted && isHi && i !== q.correctPeak;
              return (
                <button key={i} aria-label={`Peak at ${pk.shift} ppm`} onClick={() => !submitted && setShown(i)}
                  style={{ position: 'absolute', left: `calc(${p}% - 26px)`, top: 0, bottom: 56, width: 52, border: 'none', background: 'transparent', cursor: 'pointer', padding: 0 }}>
                  <div style={{
                    position: 'absolute', inset: 0, borderRadius: 6,
                    border: (isHi || right) ? `2px solid ${right ? t.ok : wrong ? t.bad : theme.accent}` : '2px dashed transparent',
                    background: (isHi || right) ? (right ? t.ok + '18' : wrong ? t.bad + '18' : theme.accentSoft) : 'transparent',
                  }} />
                </button>
              );
            })}
          </div>
        </div>
      </div>
    );
  }
  return (
    <div>
      {q.reactant && <ReactantPreview q={q} t={t} />}
      <div style={{ display: 'grid', gap: 10 }}>
        {order.map((oi, i) => {
          const opt = q.options[oi];
          const isSel = shown === i;
          const ok = submitted && opt.correct;
          const bad = submitted && isSel && !opt.correct;
          let borderColor = t.line, bgColor = t.card;
          if (ok) { borderColor = t.ok; bgColor = t.ok + '0f'; }
          else if (bad) { borderColor = t.bad; bgColor = t.bad + '0f'; }
          else if (isSel) { borderColor = t.ink; }
          return (
            <button key={oi} onClick={() => !submitted && setShown(i)} aria-pressed={isSel}
              style={{
                display: 'flex', alignItems: 'flex-start', gap: 14, padding: '14px 16px', background: bgColor,
                border: `1.5px solid ${borderColor}`, borderRadius: 12, cursor: submitted ? 'default' : 'pointer',
                textAlign: 'left', fontFamily: 'inherit', color: t.ink, width: '100%', transition: 'border-color .12s, background .12s',
              }}>
              <div style={{
                width: 28, height: 28, borderRadius: 8, flexShrink: 0,
                border: `1.5px solid ${isSel || ok ? t.ink : t.line}`, background: isSel || ok ? t.ink : 'transparent', color: isSel || ok ? t.bg : t.muted,
                display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700, fontFamily: MONO,
              }}>{String.fromCharCode(65 + i)}</div>
              <div style={{ flex: 1, paddingTop: 3 }}>
                <div style={{ fontSize: 15, letterSpacing: -0.2, lineHeight: 1.45 }}>{opt.label}</div>
                {opt.detail && <div style={{ fontSize: 12, color: t.muted, marginTop: 3, fontFamily: MONO }}>{opt.detail}</div>}
              </div>
              <kbd style={{ fontFamily: MONO, fontWeight: 700, color: t.muted, background: t.line, padding: '3px 8px', borderRadius: 4, fontSize: 10, marginTop: 3 }}>{i + 1}</kbd>
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ── feedback: short answer first, depth on request ──
function ExplainPanel({ q, t, theme, done, order, record, isLast, retry, flagged, onToggleFlag, onNext }) {
  const ok = done.ok;
  const color = ok ? t.ok : t.bad;
  const title = ok ? 'Clean reaction.' : done.ns ? 'No problem. Here is the idea.' : 'Not quite. Here is why.';
  const label = ok ? 'CORRECT' : done.ns ? 'NOT SURE' : 'NOT YET';
  const today = Engine.dayNum();
  let next = null;
  if (retry) next = 'Practice only. This retry is not counted in your progress.';
  else if (!ok) next = 'You will see this one again tomorrow.';
  else if (record && record.due != null && record.due > today) {
    const d = record.due - today;
    next = `Next check-in: ${d === 1 ? 'tomorrow' : 'in ' + d + ' days'}.`;
  }
  const picked = q.type === 'mc' && done.sel != null ? q.options[done.sel] : null;
  const others = q.type === 'mc' ? q.options.filter(o => !o.correct && o !== picked && o.why) : [];
  const rightOpt = q.type === 'mc' ? q.options.find(o => o.correct) : null;
  const arrowRight = q.type === 'arrow' ? q.arrowChoices.find(c => c.correct) : null;
  const arrowMine = q.type === 'arrow' && done.matchedId ? q.arrowChoices.find(c => c.id === done.matchedId) : null;
  const hasMore = !!q.more || others.length > 0 || (ok && q.type === 'mc' && others.length);

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 18 }}>
        <div style={{ width: 40, height: 40, borderRadius: 20, background: color, display: 'flex', alignItems: 'center', justifyContent: 'center', color: t.bg === '#16160F' ? '#0d1014' : '#fff', fontSize: 20, fontWeight: 700 }}>
          {ok ? '✓' : '✕'}
        </div>
        <div>
          <Eyebrow color={color}>{label}</Eyebrow>
          <div style={{ fontSize: 18, fontWeight: 700, color: t.ink, letterSpacing: -0.3, marginTop: 2 }}>{title}</div>
        </div>
      </div>

      <div style={{ padding: 18, background: t.card, border: `1px solid ${t.line}`, borderRadius: 14 }}>
        <Eyebrow color={t.muted} style={{ marginBottom: 10 }}>IN SHORT</Eyebrow>
        <div style={{ fontSize: 14, lineHeight: 1.6, color: t.ink, letterSpacing: -0.1, textWrap: 'pretty' }}>{q.explain}</div>
      </div>

      {!ok && picked && picked.why && (
        <div style={{ marginTop: 12, padding: 14, background: t.bad + '0d', border: `1px solid ${t.bad}40`, borderRadius: 12 }}>
          <Eyebrow color={t.bad}>WHY YOUR ANSWER DOES NOT WORK</Eyebrow>
          <div style={{ fontSize: 13, color: t.muted, marginTop: 6 }}>{picked.label}</div>
          <div style={{ fontSize: 14, color: t.ink, marginTop: 6, lineHeight: 1.55 }}>{picked.why}</div>
        </div>
      )}
      {!ok && arrowMine && arrowRight && (
        <div style={{ marginTop: 12, padding: 14, background: t.bad + '0d', border: `1px solid ${t.bad}40`, borderRadius: 12 }}>
          <Eyebrow color={t.bad}>YOUR ARROW</Eyebrow>
          <div style={{ fontSize: 14, color: t.ink, marginTop: 6 }}>{arrowMine.label}</div>
        </div>
      )}
      {!ok && (rightOpt || arrowRight || q.type === 'nmr') && (
        <div style={{ marginTop: 12, padding: 14, background: t.ok + '0f', border: `1px solid ${t.ok}40`, borderRadius: 12 }}>
          <Eyebrow color={t.ok}>CORRECT ANSWER</Eyebrow>
          <div style={{ fontSize: 14, color: t.ink, marginTop: 6, lineHeight: 1.5 }}>
            {rightOpt ? rightOpt.label : arrowRight ? arrowRight.label : `The quartet at δ ${q.peaks[q.correctPeak].shift}`}
          </div>
        </div>
      )}

      {hasMore && (
        <details style={{ marginTop: 12, padding: '12px 14px', background: t.card, border: `1px solid ${t.line}`, borderRadius: 12 }}>
          <summary style={{ cursor: 'pointer', fontFamily: MONO, fontSize: 10, letterSpacing: 1.4, fontWeight: 700, color: t.muted }}>MORE DETAIL</summary>
          <div style={{ marginTop: 10, fontSize: 13, lineHeight: 1.6, color: t.ink }}>
            {q.more && <div style={{ marginBottom: others.length ? 12 : 0 }}>{q.more}</div>}
            {others.length > 0 && (
              <div>
                <div style={{ fontSize: 12, color: t.muted, marginBottom: 6 }}>{ok ? 'Why the other options do not work' : 'The other options'}</div>
                {others.map((o, i) => (
                  <div key={i} style={{ padding: '8px 0', borderTop: i ? `1px solid ${t.line}` : 'none' }}>
                    <div style={{ fontWeight: 600 }}>{o.label}</div>
                    <div style={{ color: t.muted, marginTop: 2 }}>{o.why}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </details>
      )}

      {next && <div style={{ marginTop: 14, fontSize: 11, color: t.muted, fontFamily: MONO, letterSpacing: 0.4 }}>{next}</div>}

      <button onClick={onNext} style={{
        marginTop: 16, width: '100%', padding: '14px', borderRadius: 10, border: 'none', background: t.ink, color: t.bg,
        fontSize: 14, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
      }}>
        {isLast ? 'See summary' : 'Next question'}
        <kbd style={{ fontFamily: MONO, fontWeight: 700, background: 'rgba(128,128,128,0.25)', padding: '2px 7px', borderRadius: 4, fontSize: 11 }}>→</kbd>
      </button>
      <div style={{ marginTop: 12, textAlign: 'center' }}>
        <button onClick={onToggleFlag} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 11, color: t.muted, fontFamily: 'inherit', textDecoration: 'underline' }}>
          {flagged ? 'Flagged for review. Click to undo.' : 'Flag this question as unclear or wrong'}
        </button>
      </div>
    </div>
  );
}

function SessionView({ t, theme, bp, pad, data, blocked, onAnswer, onNext, onPause, onToggleFlag }) {
  const a = data.active;
  const q = QBY[a.ids[a.i]];
  const done = a.answers[a.i] || null;
  const submitted = !!done;
  const order = (a.orders && a.orders[q.id]) || Engine.optionOrder(q, 'fallback');
  const [sel, setSel] = React.useState(null);
  const [arrow, setArrow] = React.useState(null);
  const rightRef = React.useRef(null);
  React.useEffect(() => { setSel(null); setArrow(null); }, [a.i, q.id]);

  let shown = sel, shownArrow = arrow;
  if (done) {
    shown = q.type === 'mc' ? (done.sel == null ? null : order.indexOf(done.sel)) : done.sel;
    if (q.type === 'arrow' && done.arrow) {
      const c = q.arrowChoices.find(x => x.id === done.matchedId);
      shownArrow = { from: done.arrow.from, to: done.arrow.to, correctChoice: !!(c && c.correct), matchedId: done.matchedId };
    } else if (q.type === 'arrow') shownArrow = null;
  }
  const canSubmit = q.type === 'arrow' ? !!arrow : sel != null;
  const isLast = a.i + 1 >= a.ids.length;
  const retry = a.mode === 'retry';

  const submit = (notSure) => {
    if (submitted) return;
    if (!notSure && !canSubmit) return;
    let ok = false, selVal = null, matched = null, arrowPts = null;
    if (!notSure) {
      if (q.type === 'arrow') { ok = arrow.correctChoice; matched = arrow.matchedId; arrowPts = { from: arrow.from, to: arrow.to }; }
      else if (q.type === 'nmr') { selVal = sel; ok = sel === q.correctPeak; }
      else { selVal = order[sel]; ok = !!q.options[selVal].correct; }
    }
    onAnswer({ id: q.id, ok, sel: selVal, ns: !!notSure, matchedId: matched, arrow: arrowPts });
  };

  React.useEffect(() => {
    if (submitted && rightRef.current && bp !== 'lg' && rightRef.current.scrollIntoView) {
      try { rightRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { /* ignore */ }
    }
  }, [submitted]);

  React.useEffect(() => {
    const h = (e) => {
      if (blocked || e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (submitted) { if (e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); onNext(); } return; }
      if (q.type === 'mc') { const n = parseInt(e.key, 10); if (n >= 1 && n <= order.length) setSel(n - 1); }
      if (e.key === 'Enter' && canSubmit) { e.preventDefault(); submit(false); }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  });

  const concept = CBY[q.concept];
  const mode = MODES[a.mode];
  const subjName = a.subject === 'mixed' ? 'All courses' : SBY[a.subject] ? SBY[a.subject].short : '';
  const stacked = bp !== 'lg';
  const hint = q.type === 'arrow' ? 'DRAG, OR PICK AN OPTION' : q.type === 'nmr' ? 'CLICK A PEAK' : 'PRESS 1–4 · ENTER TO CHECK';

  return (
    <div style={{ display: 'grid', gridTemplateColumns: stacked ? '1fr' : '1fr 420px', height: '100%', width: '100%', overflow: stacked ? 'auto' : 'hidden', alignContent: stacked ? 'start' : 'stretch' }}>
      <div style={{ padding: `${pad}px ${pad}px 0`, overflow: stacked ? 'visible' : 'auto', borderRight: stacked ? 'none' : `1px solid ${t.line}` }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 6, flexWrap: 'wrap' }}>
          <Eyebrow color={t.muted}>{mode.name} · {subjName}</Eyebrow>
          <div style={{ flex: 1 }} />
          <div style={{ fontSize: 11, color: t.muted }}>Saved automatically</div>
          <Btn t={t} kind="quiet" onClick={onPause} style={{ fontSize: 12, padding: '5px 10px' }}>Pause and exit</Btn>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
          <div style={{ padding: '5px 11px', borderRadius: 6, background: theme.accentSoft, color: theme.accent, fontSize: 10, fontFamily: MONO, fontWeight: 700, letterSpacing: 1.4, textTransform: 'uppercase' }}>
            {concept.name} · {LEVEL_NAMES[q.diff]}
          </div>
          <div style={{ flex: 1, height: 3, background: t.line, borderRadius: 2, overflow: 'hidden', maxWidth: 240 }}>
            <div style={{ width: `${((a.i + (submitted ? 1 : 0)) / a.ids.length) * 100}%`, height: '100%', background: theme.accent, transition: 'width 0.3s' }} />
          </div>
          <div style={{ fontSize: 11, color: t.muted, fontFamily: MONO, fontWeight: 600 }}>{a.i + 1} / {a.ids.length}</div>
        </div>

        <div style={{ fontSize: bp === 'sm' ? 20 : 24, fontWeight: 600, color: t.ink, letterSpacing: -0.5, lineHeight: 1.3, marginBottom: 20, textWrap: 'pretty', maxWidth: 760 }}>
          {q.prompt}
        </div>

        <div style={{ maxWidth: 760 }}>
          <QuestionBody q={q} t={t} theme={theme} order={order} shown={shown} setShown={setSel} submitted={submitted} arrow={shownArrow} setArrow={setArrow} />
        </div>

        {!submitted && (
          <div style={{ marginTop: 24, marginBottom: 24, display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
            <button onClick={() => submit(false)} disabled={!canSubmit} style={{
              padding: '12px 28px', borderRadius: 10, border: 'none', background: canSubmit ? t.ink : t.line, color: canSubmit ? t.bg : t.muted,
              fontSize: 14, fontWeight: 600, cursor: canSubmit ? 'pointer' : 'default', fontFamily: 'inherit',
            }}>Check Answer</button>
            <Btn t={t} kind="quiet" onClick={() => submit(true)} title="Skip the guess and see the explanation. Counts as a miss so it comes back.">Not sure yet</Btn>
            <div style={{ fontSize: 11, color: t.muted, fontFamily: MONO }}>{hint}</div>
          </div>
        )}
        {submitted && <div style={{ height: 24 }} />}
      </div>

      <div ref={rightRef} style={{ padding: `${pad}px ${pad}px ${pad}px`, overflow: stacked ? 'visible' : 'auto', background: t.panel, borderTop: stacked ? `1px solid ${t.line}` : 'none' }}>
        {!submitted ? (
          <>
            <Eyebrow color={t.muted} style={{ marginBottom: 12 }}>COMMIT FIRST</Eyebrow>
            <div style={{ padding: 18, background: t.card, border: `1px solid ${t.line}`, borderRadius: 14 }}>
              <div style={{ fontSize: 14, fontWeight: 600, color: t.ink, letterSpacing: -0.2 }}>{concept.name}</div>
              <div style={{ fontSize: 12, color: t.muted, marginTop: 10, lineHeight: 1.55 }}>
                Pick your best answer, then the explanation opens. A confident guess teaches more than peeking. If you have no idea, choose "Not sure yet" and see the idea right away.
              </div>
            </div>
            {bp === 'lg' && (
              <div style={{ marginTop: 16, padding: 18, background: t.card, border: `1px solid ${t.line}`, borderRadius: 14 }}>
                <Eyebrow color={t.muted} style={{ marginBottom: 10 }}>SHORTCUTS</Eyebrow>
                {[['1 – 4', 'Select answer'], ['⏎', 'Check, then next'], ['→', 'Next question'], ['⌘ K', 'Commands']].map(([k, v]) => (
                  <div key={k} style={{ display: 'flex', justifyContent: 'space-between', padding: '4px 0', fontSize: 12 }}>
                    <kbd style={{ fontFamily: MONO, fontWeight: 700, color: t.ink, background: t.line, padding: '2px 8px', borderRadius: 4, fontSize: 11 }}>{k}</kbd>
                    <span style={{ color: t.muted }}>{v}</span>
                  </div>
                ))}
              </div>
            )}
          </>
        ) : (
          <ExplainPanel q={q} t={t} theme={theme} done={done} order={order} record={data.q[q.id]} isLast={isLast} retry={retry}
            flagged={data.flagged.indexOf(q.id) >= 0} onToggleFlag={() => onToggleFlag(q.id)} onNext={onNext} />
        )}
      </div>
    </div>
  );
}

// ═══ Summary: facts, not fireworks ═══
function Summary({ t, theme, bp, pad, summary, onHome, onAgain, onRetry }) {
  const n = summary.answers.length;
  const c = summary.answers.filter(x => x.ok).length;
  const missed = summary.answers.filter(x => !x.ok);
  const retry = summary.mode === 'retry';
  const concepts = [];
  missed.forEach(x => { const nm = CBY[QBY[x.id].concept].name; if (concepts.indexOf(nm) < 0) concepts.push(nm); });
  const title = retry ? 'Retry finished.' : (n >= 3 && c / n >= 0.8) ? 'Clean reaction, Connor.' : 'Session complete.';
  const tile = (value, label, color) => (
    <div style={{ flex: 1, textAlign: 'center', minWidth: 90 }}>
      <div style={{ fontSize: 36, fontWeight: 700, color: color || t.ink, letterSpacing: -0.8 }}>{value}</div>
      <Eyebrow color={t.muted} style={{ marginTop: 2 }}>{label}</Eyebrow>
    </div>
  );
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100%', width: '100%', padding: pad + 8, overflow: 'auto' }}>
      <div style={{ maxWidth: 520, width: '100%', textAlign: 'center' }}>
        <Eyebrow color={theme.accent} style={{ marginBottom: 14, letterSpacing: 1.6 }}>{retry ? 'RETRY COMPLETE' : 'SESSION COMPLETE'}</Eyebrow>
        <div style={{ fontSize: bp === 'sm' ? 34 : 46, fontWeight: 700, color: t.ink, letterSpacing: -1.2, lineHeight: 1.05 }}>{title}</div>
        <div style={{ marginTop: 28, padding: 24, background: t.card, border: `1px solid ${t.line}`, borderRadius: 16, display: 'flex', justifyContent: 'space-around', gap: 8 }}>
          {tile(n, 'REVIEWED')}
          {!retry && tile(c, 'RIGHT FIRST TRY', theme.accent)}
          {tile(retry ? summary.answers.filter(x => x.ok).length : missed.length, retry ? 'RIGHT THIS TIME' : 'COMING BACK')}
        </div>
        {!retry && missed.length > 0 && (
          <div style={{ marginTop: 16, textAlign: 'left', padding: 16, background: t.card, border: `1px solid ${t.line}`, borderRadius: 14 }}>
            <Eyebrow color={t.muted} style={{ marginBottom: 8 }}>COMES BACK TOMORROW</Eyebrow>
            <div style={{ fontSize: 14, color: t.ink, lineHeight: 1.6 }}>{concepts.join(' · ')}</div>
            <div style={{ fontSize: 12, color: t.muted, marginTop: 8 }}>Missed ideas return after a day so they have time to settle.</div>
          </div>
        )}
        <div style={{ marginTop: 24, display: 'flex', gap: 10, justifyContent: 'center', flexWrap: 'wrap' }}>
          <button onClick={onHome} style={{ padding: '12px 28px', borderRadius: 10, border: 'none', background: t.ink, color: t.bg, fontSize: 14, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>Back to Today</button>
          {!retry && <Btn t={t} onClick={onAgain}>Another round</Btn>}
          {!retry && missed.length > 0 && <Btn t={t} onClick={onRetry}>Retry the missed ones</Btn>}
        </div>
      </div>
    </div>
  );
}

// ═══ Progress: real counts only ═══
function StatTile({ t, label, value, sub }) {
  return (
    <div style={{ flex: '1 1 140px', padding: '14px 16px', background: t.card, border: `1px solid ${t.line}`, borderRadius: 12 }}>
      <Eyebrow color={t.muted}>{label}</Eyebrow>
      <div style={{ fontSize: 26, fontWeight: 700, color: t.ink, letterSpacing: -0.6, marginTop: 4 }}>{value}</div>
      {sub && <div style={{ fontSize: 11, color: t.muted, marginTop: 2 }}>{sub}</div>}
    </div>
  );
}

function Bar({ t, theme, solid, learning, fresh }) {
  const total = solid + learning + fresh || 1;
  const w = (x) => `${(x / total) * 100}%`;
  return (
    <div style={{ display: 'flex', height: 6, borderRadius: 3, overflow: 'hidden', background: t.line }} aria-hidden="true">
      <div style={{ width: w(solid), background: theme.accent }} />
      <div style={{ width: w(learning), background: theme.accent + '55' }} />
    </div>
  );
}

function ProgressView({ t, theme, bp, pad, data }) {
  const all = Engine.stats(data, null);
  return (
    <div style={{ padding: `${pad + 8}px ${pad + 8}px 40px`, overflow: 'auto', height: '100%', width: '100%' }}>
      <div style={{ maxWidth: 940, margin: '0 auto' }}>
        <Eyebrow color={theme.accent} style={{ marginBottom: 12 }}>PROGRESS</Eyebrow>
        <div style={{ fontSize: bp === 'sm' ? 28 : 36, fontWeight: 700, color: t.ink, letterSpacing: -1, lineHeight: 1.1 }}>What is sticking</div>
        <div style={{ marginTop: 10, fontSize: 14, color: t.muted, lineHeight: 1.55, maxWidth: 680 }}>
          <b style={{ color: t.ink }}>Solid</b> means right on the first try across three spaced reviews. Finishing questions is not the same as knowing them, so only first-try answers count toward accuracy. Everything here comes from your actual answers.
        </div>

        <div style={{ marginTop: 20, display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <StatTile t={t} label="ANSWERED" value={all.n} sub={all.n ? 'first attempts' : 'nothing yet'} />
          <StatTile t={t} label="FIRST-TRY ACCURACY" value={all.acc == null ? 'n/a' : pct(all.acc)} sub={all.n ? `${all.c} of ${all.n}` : 'appears after your first answers'} />
          <StatTile t={t} label="SOLID" value={all.solid} sub={`of ${all.total} questions`} />
          <StatTile t={t} label="READY TO REVISIT" value={all.ready} sub="no pressure" />
        </div>

        {SUBJECTS.map(s => {
          const ss = Engine.stats(data, q => q.subject === s.id);
          const areas = [];
          CONCEPTS.filter(c => c.subject === s.id).forEach(c => { if (areas.indexOf(c.area) < 0) areas.push(c.area); });
          return (
            <div key={s.id} style={{ marginTop: 30 }}>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 12, flexWrap: 'wrap' }}>
                <div style={{ fontSize: 18, fontWeight: 700, color: t.ink, letterSpacing: -0.3 }}>{s.name}</div>
                <div style={{ fontSize: 11, color: t.muted, fontFamily: MONO }}>{s.code ? `${s.code} · ${s.credits} CR` : 'FOUNDATION REVIEW'}</div>
                <div style={{ flex: 1 }} />
                <div style={{ fontSize: 12, color: t.muted }}>
                  {ss.seen} of {ss.total} seen · {ss.solid} solid · {ss.acc == null ? 'no first-try data yet' : `${pct(ss.acc)} first try (${ss.n})`}
                </div>
              </div>
              <div style={{ marginTop: 12, background: t.card, border: `1px solid ${t.line}`, borderRadius: 14, overflow: 'hidden' }}>
                {areas.map((area, ai) => (
                  <div key={area} style={{ borderTop: ai ? `1px solid ${t.line}` : 'none' }}>
                    <Eyebrow color={t.muted} style={{ padding: '12px 16px 4px' }}>{area}</Eyebrow>
                    {CONCEPTS.filter(c => c.subject === s.id && c.area === area).map(c => {
                      const cs = Engine.stats(data, q => q.concept === c.id);
                      const look = cs.n >= 3 && cs.acc < 0.6;
                      return (
                        <div key={c.id} style={{ display: 'grid', gridTemplateColumns: bp === 'sm' ? '1fr' : 'minmax(160px, 1.3fr) 1fr minmax(170px, 1fr)', gap: bp === 'sm' ? 6 : 16, alignItems: 'center', padding: '9px 16px' }}>
                          <div style={{ fontSize: 13, color: t.ink, fontWeight: 500 }}>
                            {c.name}{look && <span style={{ marginLeft: 8, fontSize: 9, fontFamily: MONO, letterSpacing: 1.2, fontWeight: 700, color: t.bad }}>WORTH A LOOK</span>}
                          </div>
                          <Bar t={t} theme={theme} solid={cs.solid} learning={cs.learning} fresh={cs.fresh} />
                          <div style={{ fontSize: 11, color: t.muted, fontFamily: MONO }}>
                            {cs.solid} solid · {cs.learning} learning · {cs.fresh} new{cs.n ? ` · ${pct(cs.acc)} (${cs.n})` : ''}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>
            </div>
          );
        })}
        {all.n === 0 && <div style={{ marginTop: 24, fontSize: 13, color: t.muted }}>Nothing to show yet. Answer a few questions and this page fills in with real numbers.</div>}
      </div>
    </div>
  );
}

// ═══ Backup: simple export / import, kept honest ═══
function BackupView({ t, theme, bp, pad, data, saved, onExport, onImport, onReset }) {
  const [msg, setMsg] = React.useState(null);
  const [pending, setPending] = React.useState(null);
  const [confirmReset, setConfirmReset] = React.useState(false);
  const fileRef = React.useRef(null);
  const total = Engine.stats(data, null);

  const pick = (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try { setPending(window.Retron.parseImport(String(reader.result))); setMsg(null); }
      catch (err) { setPending(null); setMsg('That file is not a Retron backup. Nothing was changed.'); }
    };
    reader.onerror = () => setMsg('Could not read that file. Nothing was changed.');
    reader.readAsText(f);
  };
  const card = { padding: 18, background: t.card, border: `1px solid ${t.line}`, borderRadius: 14, marginTop: 14 };
  const pendingAnswers = pending ? Object.keys(pending.data.q).reduce((n, k) => n + (pending.data.q[k].n || 0), 0) : 0;

  return (
    <div style={{ padding: `${pad + 8}px ${pad + 8}px 40px`, overflow: 'auto', height: '100%', width: '100%' }}>
      <div style={{ maxWidth: 760, margin: '0 auto' }}>
        <Eyebrow color={theme.accent} style={{ marginBottom: 12 }}>BACKUP</Eyebrow>
        <div style={{ fontSize: bp === 'sm' ? 28 : 36, fontWeight: 700, color: t.ink, letterSpacing: -1, lineHeight: 1.1 }}>Keep your progress safe</div>
        <div style={{ marginTop: 10, fontSize: 14, color: t.muted, lineHeight: 1.55 }}>
          Progress is saved automatically in this browser on this computer. Clearing browser data would erase it, so export a backup file once in a while.
        </div>

        {!saved && (
          <div style={{ ...card, borderColor: t.bad + '66', background: t.bad + '0d', color: t.ink, fontSize: 13, lineHeight: 1.5 }}>
            This browser is blocking saving, so progress will be lost when you close the page. Open the Retron file directly in Safari or Chrome to keep it.
          </div>
        )}

        <div style={card}>
          <Eyebrow color={t.muted}>EXPORT</Eyebrow>
          <div style={{ fontSize: 13, color: t.ink, marginTop: 8, lineHeight: 1.5 }}>
            Saves a small file with your answers and review schedule. Last backup: {fmtDate(data.lastExport)}. You have {plural(total.n, 'saved answer')}.
          </div>
          <Btn t={t} kind="primary" onClick={onExport} style={{ marginTop: 12 }}>Export backup</Btn>
        </div>

        <div style={card}>
          <Eyebrow color={t.muted}>IMPORT</Eyebrow>
          <div style={{ fontSize: 13, color: t.ink, marginTop: 8, lineHeight: 1.5 }}>Restore from a backup file. This replaces the progress currently on this computer.</div>
          <input ref={fileRef} type="file" accept=".json,application/json" onChange={pick} style={{ display: 'none' }} />
          <Btn t={t} onClick={() => fileRef.current && fileRef.current.click()} style={{ marginTop: 12 }}>Choose backup file</Btn>
          {msg && <div style={{ marginTop: 10, fontSize: 13, color: t.bad }}>{msg}</div>}
          {pending && (
            <div style={{ marginTop: 12, padding: 12, borderRadius: 10, background: t.hover }}>
              <div style={{ fontSize: 13, color: t.ink }}>
                Backup from {fmtDate(pending.exportedAt)} with {plural(pendingAnswers, 'saved answer')}. Replace current progress with it?
              </div>
              <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
                <Btn t={t} kind="primary" onClick={() => { onImport(pending.data); setPending(null); setMsg(null); }}>Replace progress</Btn>
                <Btn t={t} onClick={() => setPending(null)}>Cancel</Btn>
              </div>
            </div>
          )}
        </div>

        {data.flagged.length > 0 && (
          <div style={card}>
            <Eyebrow color={t.muted}>FLAGGED QUESTIONS</Eyebrow>
            <div style={{ fontSize: 12, color: t.muted, marginTop: 6 }}>Marked as unclear or wrong. Worth checking against your course materials.</div>
            {data.flagged.map(id => QBY[id] && (
              <div key={id} style={{ marginTop: 10, fontSize: 13, color: t.ink, lineHeight: 1.45 }}>
                <span style={{ fontFamily: MONO, fontSize: 10, color: t.muted }}>{id}</span> {QBY[id].prompt}
              </div>
            ))}
          </div>
        )}

        <div style={card}>
          <Eyebrow color={t.muted}>START OVER</Eyebrow>
          <div style={{ fontSize: 13, color: t.ink, marginTop: 8, lineHeight: 1.5 }}>Erase all saved progress on this computer. Export a backup first if you might want it back.</div>
          {!confirmReset
            ? <Btn t={t} kind="danger" onClick={() => setConfirmReset(true)} style={{ marginTop: 12 }}>Erase progress</Btn>
            : (
              <div style={{ display: 'flex', gap: 8, marginTop: 12, alignItems: 'center', flexWrap: 'wrap' }}>
                <span style={{ fontSize: 13, color: t.ink }}>Erase everything?</span>
                <Btn t={t} kind="danger" onClick={() => { onReset(); setConfirmReset(false); }}>Yes, erase</Btn>
                <Btn t={t} onClick={() => setConfirmReset(false)}>Cancel</Btn>
              </div>
            )}
        </div>
      </div>
    </div>
  );
}

// ═══ Command palette (⌘K), now with working commands ═══
function CommandPalette({ onClose, t, theme, items }) {
  const [text, setText] = React.useState('');
  const [hi, setHi] = React.useState(0);
  const shown = items.filter(it => it.label.toLowerCase().indexOf(text.toLowerCase()) >= 0);
  React.useEffect(() => { setHi(0); }, [text]);
  const run = (it) => { if (!it) return; onClose(); it.action(); };
  const onKey = (e) => {
    if (e.key === 'Escape') { e.preventDefault(); onClose(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); setHi(h => Math.min(h + 1, shown.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setHi(h => Math.max(h - 1, 0)); }
    else if (e.key === 'Enter') { e.preventDefault(); run(shown[hi]); }
  };
  return (
    <div onClick={onClose} style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.15)', display: 'flex', alignItems: 'flex-start', justifyContent: 'center', paddingTop: 100, zIndex: 200, backdropFilter: 'blur(4px)' }}>
      <div onClick={e => e.stopPropagation()} style={{ width: 'min(560px, 92%)', background: t.card, borderRadius: 14, boxShadow: '0 30px 80px rgba(0,0,0,0.25)', overflow: 'hidden', maxHeight: '70%', display: 'flex', flexDirection: 'column' }}>
        <div style={{ padding: '14px 18px', borderBottom: `1px solid ${t.line}`, display: 'flex', alignItems: 'center', gap: 10 }}>
          <svg width="14" height="14" viewBox="0 0 14 14"><circle cx="6" cy="6" r="4.5" stroke={t.muted} strokeWidth="1.5" fill="none" /><path d="M9.5 9.5L13 13" stroke={t.muted} strokeWidth="1.5" strokeLinecap="round" /></svg>
          <input autoFocus value={text} onChange={e => setText(e.target.value)} onKeyDown={onKey} placeholder="Type a command…"
            style={{ flex: 1, border: 'none', outline: 'none', background: 'transparent', fontSize: 14, color: t.ink, fontFamily: 'inherit' }} />
          <kbd style={{ fontFamily: MONO, fontWeight: 700, color: t.muted, background: t.line, padding: '3px 8px', borderRadius: 4, fontSize: 10 }}>ESC</kbd>
        </div>
        <div style={{ overflow: 'auto' }}>
          {shown.length === 0 && <div style={{ padding: '14px 18px', fontSize: 13, color: t.muted }}>No matching command.</div>}
          {shown.map((it, i) => (
            <div key={it.label} onClick={() => run(it)} onMouseEnter={() => setHi(i)}
              style={{ padding: '12px 18px', fontSize: 13, color: t.ink, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: i < shown.length - 1 ? `1px solid ${t.line}` : 'none', background: i === hi ? theme.accentSoft : 'transparent' }}>
              {it.label}
              {it.kbd && <span style={{ color: theme.accent, fontWeight: 700 }}>{it.kbd}</span>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ═══ App shell ═══
function RetronApp({ theme, themeKey, setThemeKey, density, setDensity, store }) {
  const { data, update, replace, saved, ref } = store;
  const t = tokensFor(theme);
  const width = useWidth();
  const bp = width < 820 ? 'sm' : width < 1240 ? 'md' : 'lg';
  const pad = density === 'compact' ? 20 : 32;
  const [ui, setUi] = React.useState({ screen: 'home', summary: null });
  const [paletteOpen, setPaletteOpen] = React.useState(false);
  const go = (screen) => setUi(u => ({ ...u, screen }));
  const setFocus = (id) => update(d => { d.focus = id; });

  const startSession = (modeId, subject, ids) => {
    update(d => { d.active = Engine.newSession(d, modeId, subject == null ? d.focus : subject, undefined, ids); });
    setUi({ screen: 'session', summary: null });
  };
  const onAnswer = (info) => update(d => {
    Engine.answer(d, info.id, info.ok, { retry: d.active.mode === 'retry' });
    d.active.answers.push(info);
  });
  const onNext = () => {
    const a = ref.current.active;
    if (!a) return;
    if (a.i + 1 >= a.ids.length) {
      let summary = null;
      update(d => {
        const act = d.active;
        Engine.finishSession(d);
        summary = { mode: act.mode, subject: act.subject, answers: act.answers };
      });
      setUi({ screen: 'summary', summary });
    } else update(d => { d.active.i += 1; });
  };
  const toggleFlag = (id) => update(d => {
    const i = d.flagged.indexOf(id);
    if (i >= 0) d.flagged.splice(i, 1); else d.flagged.push(id);
  });
  const exportBackup = () => {
    update(d => { d.lastExport = Date.now(); });
    const text = window.Retron.exportPayload(ref.current);
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const el = document.createElement('a');
    const iso = new Date().toISOString().slice(0, 10);
    el.href = url; el.download = `retron-backup-${iso}.json`;
    document.body.appendChild(el); el.click(); el.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  };

  // ⌘K
  React.useEffect(() => {
    const h = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setPaletteOpen(p => !p); }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);

  const screen = ui.screen === 'session' && !data.active ? 'home' : ui.screen === 'summary' && !ui.summary ? 'home' : ui.screen;
  let main;
  if (screen === 'session') {
    main = <SessionView key={data.active.ids.join(',')} t={t} theme={theme} bp={bp} pad={pad} data={data} blocked={paletteOpen}
      onAnswer={onAnswer} onNext={onNext} onPause={() => go('home')} onToggleFlag={toggleFlag} />;
  } else if (screen === 'summary') {
    const s = ui.summary;
    const missedIds = s.answers.filter(x => !x.ok).map(x => x.id);
    main = <Summary t={t} theme={theme} bp={bp} pad={pad} summary={s} onHome={() => go('home')}
      onAgain={() => startSession(s.mode === 'retry' ? 'daily' : s.mode, s.subject)}
      onRetry={() => startSession('retry', s.subject, missedIds)} />;
  } else if (screen === 'progress') {
    main = <ProgressView t={t} theme={theme} bp={bp} pad={pad} data={data} />;
  } else if (screen === 'backup') {
    main = <BackupView t={t} theme={theme} bp={bp} pad={pad} data={data} saved={saved} onExport={exportBackup}
      onImport={(d) => { replace(d); }} onReset={() => replace(window.Retron.Engine.blank())} />;
  } else {
    main = <Home t={t} theme={theme} bp={bp} pad={pad} data={data} onStart={(m) => startSession(m)} onResume={() => go('session')} setFocus={setFocus} />;
  }

  const items = [
    { label: 'Start Daily Review', kbd: '5 Q', action: () => startSession('daily') },
    { label: 'Start Quick Warm-Up', kbd: '~2 min', action: () => startSession('warm') },
    { label: 'Start Deep Practice', kbd: '~15 min', action: () => startSession('deep') },
    ...(data.active ? [{ label: 'Resume paused session', action: () => go('session') }] : []),
    { label: 'Focus: Mix of all courses', kbd: data.focus === 'mixed' ? '●' : '', action: () => { setFocus('mixed'); go('home'); } },
    ...SUBJECTS.map(s => ({ label: `Focus: ${s.name}`, kbd: data.focus === s.id ? '●' : '', action: () => { setFocus(s.id); go('home'); } })),
    { label: 'Go to Today', action: () => go('home') },
    { label: 'Go to Progress', action: () => go('progress') },
    { label: 'Go to Backup', action: () => go('backup') },
    { label: 'Export backup', action: exportBackup },
    ...Object.entries(THEMES).map(([k, th]) => ({ label: `Theme: ${th.name}`, kbd: themeKey === k ? '●' : '', action: () => setThemeKey(k) })),
    { label: `Density: ${density === 'comfy' ? 'Switch to compact' : 'Switch to comfy'}`, action: () => setDensity(density === 'comfy' ? 'compact' : 'comfy') },
  ];

  const titles = { home: 'Today', progress: 'Progress', backup: 'Backup', summary: 'Session complete',
    session: data.active ? MODES[data.active.mode].name : 'Session' };

  return (
    <CustomMacWindow dark={theme.dark} title={`Retron · ${titles[screen]}`}
      style={{ width: 'min(1560px, 100%)', height: bp === 'sm' ? 'calc(100vh - 70px)' : 'clamp(620px, calc(100vh - 150px), 970px)', minHeight: 560 }}>
      <div style={{ display: 'flex', width: '100%', height: '100%', position: 'relative', flexDirection: bp === 'sm' ? 'column' : 'row' }}>
        {bp === 'sm'
          ? <TopNav t={t} theme={theme} screen={screen} go={go} />
          : <Sidebar t={t} theme={theme} data={data} screen={screen} go={go} setFocus={setFocus} width={bp === 'lg' ? 260 : 220} />}
        <div style={{ flex: 1, minWidth: 0, minHeight: 0, display: 'flex', flexDirection: 'column', background: t.winBg }}>
          {!saved && screen !== 'backup' && (
            <div style={{ padding: '8px 16px', fontSize: 12, background: t.bad + '14', color: t.ink, borderBottom: `1px solid ${t.line}` }}>
              This browser is not saving progress. Open the file directly in Safari or Chrome to keep it.
            </div>
          )}
          <div style={{ flex: 1, minHeight: 0, display: 'flex' }}>{main}</div>
        </div>
        {paletteOpen && <CommandPalette onClose={() => setPaletteOpen(false)} t={t} theme={theme} items={items} />}
      </div>
    </CustomMacWindow>
  );
}

// ═══ Root: theme, density, and the original edit-mode hooks ═══
function Root() {
  const store = useRetronData();
  const { data, update } = store;
  const themeKey = THEMES[data.prefs.theme] ? data.prefs.theme : TWEAK_DEFAULS.theme;
  const density = data.prefs.density || TWEAK_DEFAULS.density;
  const theme = { ...THEMES[themeKey], key: themeKey };
  React.useEffect(() => { applyThemeVars(theme); }, [themeKey]);
  React.useEffect(() => { document.title = 'Retron · Study Companion'; }, []);

  const [tweaksOpen, setTweaksOpen] = React.useState(false);
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data && e.data.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data && e.data.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch (e) { /* standalone */ }
    return () => window.removeEventListener('message', handler);
  }, []);

  const changeTheme = (k) => {
    update(d => { d.prefs.theme = k; });
    try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { theme: k } }, '*'); } catch (e) { /* standalone */ }
  };
  const changeDensity = (v) => {
    update(d => { d.prefs.density = v; });
    try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { density: v } }, '*'); } catch (e) { /* standalone */ }
  };

  const width = useWidth();
  const small = width < 820;
  return (
    <div style={{ minHeight: '100vh', width: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', padding: small ? '10px 8px' : '40px 20px' }} data-screen-label="01 Retron">
      {!small && (
        <div className="stage-caption" style={{ color: theme.dark ? 'rgba(255,255,255,0.7)' : undefined }}>
          RETRON · STUDY COMPANION
          <span className="sub" style={{ color: theme.dark ? 'rgba(255,255,255,0.4)' : undefined }}>
            FOR CONNOR · RUTGERS · SPRING 2027 · ⌘K FOR COMMANDS
          </span>
        </div>
      )}
      <RetronApp theme={theme} themeKey={themeKey} setThemeKey={changeTheme} density={density} setDensity={changeDensity} store={store} />

      {tweaksOpen && (
        <div className="tweaks">
          <h4>Color theme</h4>
          <div className="theme-row">
            {Object.entries(THEMES).map(([k, th]) => (
              <div key={k} className="swatch"
                style={{
                  background: th.dark ? '#0A0A09' : '#FAFAF7', color: th.accent,
                  border: '2px solid ' + (themeKey === k ? '#0E0E0C' : 'rgba(0,0,0,0.1)'),
                  transform: themeKey === k ? 'scale(1.04)' : 'scale(1)',
                }}
                onClick={() => changeTheme(k)}
              >{th.name.split(' ')[0].toUpperCase()}</div>
            ))}
          </div>
          <h4 style={{ marginTop: 14 }}>Density</h4>
          <div className="density-row">
            {['comfy', 'compact'].map(d => (
              <button key={d} className={'density-btn' + (density === d ? ' active' : '')} onClick={() => changeDensity(d)}>{d.toUpperCase()}</button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);

</script>
